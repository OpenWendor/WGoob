- type: entity
  parent: CMCartridge10x20mmAP
  id: VehicleCartridgeLTAAAP
  name: cartridge (10x20mm-APC)
  components:
  - type: CartridgeAmmo
    proto: VehicleBulletLTAAAP

# Projectiles
- type: entity
  id: VehicleLTBCannonImpact
  name: LTB cannon impact
  categories: [ HideSpawnMenu, Spawner ]
  components:
  - type: TriggerOnSpawn
  - type: ExplodeOnTrigger
  - type: DeleteOnTrigger
  - type: Explosive
    explosionType: RMCLTBCannon
    maxIntensity: 40
    intensitySlope: 18
    totalIntensity: 650
    tileBreakScale: 4
    maxTileBreak: 12

- type: entity
  parent: RMCBaseBullet
  id: RMCProjectileAceAutocannonFlak
  name: ACE flak round
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Ammunition/Projectiles/bullet_projectiles.rsi
    drawdepth: Effects
    layers:
    - state: bullet
      shader: unshaded
  - type: Projectile
    impactEffect: BulletImpactEffect
    damage:
      types:
        Piercing: 60
    soundHit:
      path: /Audio/Weapons/Guns/Hits/bullet_hit.ogg
  - type: ProjectileGrenade
    minVelocity: 0.4
    maxVelocity: 1.8
    capacity: 10

- type: entity
  parent: RMCBaseBullet
  id: VehicleProjectileDragonFlame
  name: DRGN flame jet
  categories: [ HideSpawnMenu ]
  components:
  - type: TriggerOnCollide
    fixtureID: projectile
    ignoreOtherNonHard: false
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Ammunition/Projectiles/firesentry_projectile.rsi
    drawdepth: Effects
    layers:
    - state: pulse0
      shader: unshaded
  - type: Projectile
    deleteOnCollide: true
    impactEffect: null
    forceSound: true
    damage:
      types:
        Heat: 85
    soundHit: null
  - type: IgniteOnCollide
    fireStacks: 6
  - type: DeleteOnTrigger
  - type: Fixtures
    fixtures:
      projectile:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.15,-0.45,0.15,0.15"
        hard: false
        mask:
        - Impassable
        - BulletImpassable

- type: entity
  parent: Bullet10x20mmAP
  id: VehicleBulletLTAAAP
  name: bullet (10x20mm-APC)
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 40

- type: entity
  id: VehicleDragonFlameImpact
  name: DRGN flame impact
  categories: [ HideSpawnMenu, Spawner ]
  components:
  - type: TriggerOnSpawn
  - type: SpawnOnTrigger
    proto: Smoke

