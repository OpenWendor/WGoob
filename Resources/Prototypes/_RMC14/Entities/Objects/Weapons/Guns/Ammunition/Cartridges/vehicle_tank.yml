- type: entity
  parent: BaseCartridgeRifle
  id: VehicleCartridgeLTBCannon
  name: cartridge (LTB cannon)
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Casings/large_casing.rsi
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
  - type: CartridgeAmmo
    proto: RMCProjectileLTBCannon
    muzzleFlash: MuzzleFlashEffectVehicleOverLarge

- type: entity
  parent: BaseCartridgeRifle
  id: VehicleCartridgeAceAutocannon
  name: cartridge (ACE autocannon)
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Casings/large_casing.rsi
    layers:
