- type: entity
  id: VehiclePeekAnchor
  parent: MarkerBase
  categories: [ HideSpawnMenu ]
  components:
  - type: Physics
    bodyType: Static
    canCollide: false

- type: entity
  id: VehicleExitArea
  parent: MarkerBase
  name: vehicle exit marker
  description: A clickable marker used for vehicle exits.
  placement:
    mode: PlaceFree
  components:
  - type: Icon
    sprite: _RMC14/Markers/landmarks.rsi
    state: invisible_wall
  - type: Sprite
    drawdepth: LowFloors
    texture: /Textures/_RMC14/Tiles/floors/void.png
  - type: VehicleExit
  # - type: Vehicle # Erida edit
  - type: Physics
    bodyType: Static
    canCollide: true
  - type: Fixtures
    fixtures:
      marker:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,0.49"
        density: 20000
        hard: true
        mask:
        - FullTileMask
        layer:
        - HighImpassable
        - MidImpassable
        - LowImpassable
        - Opaque

- type: entity
  parent: MarkerBase
  id: RMCWallInvisibleBulletBlocker
  name: wall blocker
  suffix: Projectile Blocker
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: _RMC14/Markers/landmarks.rsi
    state: invisible_wall
  - type: Transform
    anchored: false
  - type: Physics
    bodyType: Static
  - type: PlacementReplacement
    key: walls
  - type: Occluder
    enabled: false
  - type: Airtight
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        hard: true
        mask:
        - FullTileMask
        - MobMask
        layer:
        - HighImpassable
        - MidImpassable
        - LowImpassable
        - InteractImpassable
        - BulletImpassable
        density: 1000

