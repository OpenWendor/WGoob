- type: entity
  id: VehicleAPCBase
  abstract: true
  name: armored personnel carrier
  description: A rugged armored personnel carrier outfitted for battlefield support.
  # erida edit
  editorSuffix: rmc-vehicle
  components:
  - type: Vehicle
    movementKind: Grid
  - type: LagCompensation
  - type: Clickable
  - type: RequireProjectileTarget
  - type: GridVehicleMover
    maxSpeed: 5
    acceleration: 4
    deceleration: 10
    turnDelay: 0.4
    xenoBlockMinimumSize: Immobile
    xenoPushMinimumSize: Immobile
  - type: VehicleOvercharge
    speedMultiplier: 1.4
    duration: 3
    cooldown: 15
    overchargeSound: /Audio/_RMC14/Vehicle/overdrive_activate.ogg
    smashSelfDamage: 150
  - type: VehicleSound
    runningSound: /Audio/Effects/Vehicle/vehicleengineidle.ogg
    runningSoundCooldown: 2
    hornSound: /Audio/Effects/Vehicle/carhorn.ogg
    hornCooldown: 1
    collisionSoundCooldown: 0.5
    mobCollisionSound: /Audio/_RMC14/Xeno/alien_claw_block.ogg
  - type: VehicleSpotlight
    radius: 7
    energy: 3
    softness: 2
  - type: Physics
    bodyType: Dynamic
  - type: Fixtures
    fixtures:
      world:
        shape:
          !type:PhysShapeAabb
          bounds: -1,-1.7,1,1.7
        density: 1200
        mask:
        - Impassable
        - HighImpassable
        - LowImpassable
        - LargeMobLayer
        - Vehicle
        layer:
        - LargeMobLayer
        - Vehicle
      mob:
        shape:
          !type:PhysShapeAabb
          bounds: -1,-1.7,1,1.7
        density: 1200
        mask:
        - MidImpassable
        - BarricadeImpassable
        - LargeMobLayer
        layer:
        - LargeMobLayer
  - type: Damageable
    damageModifierSet: VehicleFrameAPC
  - type: Injurable
    damageContainer: StructuralMarine
  - type: InteractionOutline
  - type: Sprite
    drawdepth: Mobs
    sprite: _RMC14/Structures/Vehicles/apc.rsi
    layers:
    - map: [ base ]
      state: apc_base
    - map: [ damaged_frame ]
      state: damaged_frame
      visible: false
    - map: [ primary ]
      state: PRIMARY
      visible: false
    - map: [ secondary ]
      state: SECONDARY
      visible: false
    - map: [ support ]
      state: SUPPORT
      visible: false
    - map: [ rmc-wheels ]
      state: wheels_1
  - type: SpriteMovement
    movementLayers:
      rmc-wheels:
        state: wheels_0
    noMovementLayers:
      rmc-wheels:
        state: wheels_1
  - type: PointLight
    enabled: false
    radius: 12
    energy: 2.5
    softness: 2
    autoRot: true
    offset: "0,0.9"
  - type: DoAfter
  - type: UserInterface
    interfaces:
      enum.HardpointUiKey.Key:
        type: HardpointBoundUserInterface
      enum.VehicleWeaponsUiKey.Key:
        type: VehicleWeaponsBoundUserInterface
  - type: VehicleWeapons
  - type: VehicleHardpointVisuals
  - type: InputMover
  - type: ItemSlots
    slots:
      port-gun-north:
        startingItem: VehicleAPCM56FPWPortGunRight
        insertOnInteract: false
        ejectOnInteract: false
        ejectOnUse: false
        locked: true
        disableEject: true
        whitelist:
          components:
          - VehiclePortGun
      port-gun-south:
        startingItem: VehicleAPCM56FPWPortGunLeft
        insertOnInteract: false
        ejectOnInteract: false
        ejectOnUse: false
        locked: true
        disableEject: true
        whitelist:
          components:
          - VehiclePortGun
  - type: HardpointSlots
    vehicleFamily: HardpointVehicleFamilyAPC
    slots:
    - id: primary
      hardpointType: HardpointTypeTurret
      slotType: HardpointSlotTypeTurret
      visualLayer: primary
      insertDelay: 2.5
      required: false
    - id: secondary
      hardpointType: HardpointTypeCannon
      slotType: HardpointSlotTypeCannon
      visualLayer: secondary
      insertDelay: 2.5
      required: false
    - id: support
      hardpointType: HardpointTypeSupportAttachment
      slotType: HardpointSlotTypeSupportAttachment
      visualLayer: support
      insertDelay: 2.0
      required: false
    - id: wheel-1
      hardpointType: HardpointTypeWheel
      slotType: HardpointSlotTypeWheel
      insertDelay: 1.5
  - type: VehicleWheelSlots
    slotCount: 1
  - type: HardpointIntegrity
    maxIntegrity: 1000
    repairFuelCost: 15
    bypassEntryOnZero: true
  - type: Appearance
  # erida edit
  - type: Strap
    position: Stand
    blockMovement: false
  - type: VehicleDriverSeat
  - type: VehicleWeaponsSeat

- type: entity
  parent: VehicleAPCBase
  id: VehicleAPC

- type: entity
  parent: VehicleAPCBase
  id: VehicleAPCMed
  name: armored personnel carrier (medical)
  description: A medical-configured APC outfitted with triage markings.
  components:
  - type: Sprite
    layers:
    - map: [ base ]
      state: apc_base_med
    - map: [ damaged_frame ]
      state: damaged_frame
      visible: false
    - map: [ primary ]
      state: PRIMARY
      visible: false
    - map: [ secondary ]
      state: SECONDARY
      visible: false
    - map: [ support ]
      state: SUPPORT
      visible: false
    - map: [ rmc-wheels ]
      state: wheels_1

- type: entity
  parent: VehicleAPCBase
  id: VehicleAPCCommand
  name: armored personnel carrier (command)
  description: A command-configured APC bristling with sensors and comms gear.
  components:
  - type: Sprite
    layers:
    - map: [ base ]
      state: apc_base_com
    - map: [ damaged_frame ]
      state: damaged_frame
      visible: false
    - map: [ primary ]
      state: PRIMARY
      visible: false
    - map: [ secondary ]
      state: SECONDARY
      visible: false
    - map: [ support ]
      state: SUPPORT
      visible: false
    - map: [ rmc-wheels ]
      state: wheels_1
