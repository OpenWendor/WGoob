- type: entity
  parent: VehicleVanInteriorBase
  id: VehicleViewport
  name: vehicle viewport
  description: A small viewport for peering outside.
  placement:
    mode: PlaceFree
  components:
  - type: WallMount
    arc: 360
  - type: Sprite
    sprite: _RMC14/Structures/Vehicles/Interiors/general.rsi
    state: viewport
    drawdepth: Overdoors
  - type: Clickable
  - type: InteractionOutline
  - type: VehicleViewport

- type: entity
  parent: VehicleViewport
  id: VehicleViewportUnanchored
  name: vehicle viewport (unanchored)
  description: A small viewport for peering outside.
  placement:
    mode: PlaceFree
  components:
  - type: Transform
    anchored: false
  - type: Physics
    bodyType: Static
    canCollide: false

- type: entity
  parent: VehicleViewport
  id: VehicleViewportSimple
  name: vehicle viewport (simple)
  description: A small viewport for peering outside.
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Vehicles/Interiors/general.rsi
    state: viewport_simple
