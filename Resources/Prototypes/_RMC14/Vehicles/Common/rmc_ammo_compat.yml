
- type: entity
  parent: BaseBullet
  id: RMCBaseBullet
  abstract: true

- type: entity
  parent: RMCBaseBullet
  id: CMBulletSentry10x50mm
  name: bullet (10x50mm)
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 20

- type: entity
  parent: BaseCartridgeRifle
  id: CMCartridgeSentry10x50mm
  name: cartridge (10x50mm)
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Casings/large_casing.rsi
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
  - type: CartridgeAmmo
    proto: CMBulletSentry10x50mm

- type: entity
  abstract: true
  parent: SeatBase
  id: CMSeatBase
  name: abstract chair
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Furniture/vehicle_seats.rsi
    state: base

- type: entity
  parent: BaseBullet
  id: Bullet10x20mmAP
  name: bullet (10x20mm AP)
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 18

- type: entity
  parent: BaseCartridgeRifle
  id: CMCartridge10x20mmAP
  name: cartridge (10x20mm AP)
  components:
  - type: CartridgeAmmo
    proto: Bullet10x20mmAP

- type: entity
  parent: BaseBullet
