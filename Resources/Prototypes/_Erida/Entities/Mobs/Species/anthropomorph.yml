- type: entity
  save: false
  name: Urist McAnthropomorph
  parent: BaseMobSpeciesOrganic
  id: BaseMobAnthropomorph
  abstract: true
  components:
  - type: HumanoidAppearance
    species: Anthropomorph
    hideLayersOnEquip:
    - Hair
    - Snout
    - HeadTop
    - HeadSide
    - Tail
  - type: Inventory
    speciesId: Anthropomorph
    displacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: _Corvax/Mobs/Species/Vulpkanin/displacement.rsi # Corvax vulpkanins
            state: jumpsuit
      outerClothing:
        sizeMaps:
          32:
            sprite: _Corvax/Mobs/Species/Vulpkanin/displacement.rsi # Corvax vulpkanins
            state: outerwear
      shoes:
        sizeMaps:
          32:
            sprite: _Corvax/Mobs/Species/Vulpkanin/displacement.rsi # Corvax vulpkanins
            state: shoes
      head:
        sizeMaps:
          32:
            sprite: _Corvax/Mobs/Species/Vulpkanin/displacement.rsi # Corvax vulpkanins
            state: head
      socks:
        sizeMaps:
          32:
            sprite: _Corvax/Mobs/Species/Vulpkanin/displacement.rsi # Corvax vulpkanins
            state: shoes
  - type: Thirst
  - type: Hunger
  - type: Icon
    sprite: _Orion/Mobs/Species/Anthropomorph/parts.rsi
    state: full
  - type: Body
    prototype: Anthropomorph
  - type: Speech
    speechSounds: Lizard
  - type: LanguageKnowledge # Einstein Engines - Languages
    speaks:
    - TauCetiBasic
    - Canilunzt
    understands:
    - TauCetiBasic
    - Canilunzt
  - type: Sprite
    netsync: false
    noRot: true
    drawdepth: Mobs
    layers:
      - map: [ "enum.HumanoidVisualLayers.Groin" ]
      - map: [ "enum.HumanoidVisualLayers.Chest" ]
      - map: [ "enum.HumanoidVisualLayers.Head" ]
      - map: [ "enum.HumanoidVisualLayers.Snout" ]
      - map: [ "enum.HumanoidVisualLayers.Eyes" ]
      - map: [ "enum.HumanoidVisualLayers.RArm" ]
      - map: [ "enum.HumanoidVisualLayers.LArm" ]
      - map: [ "enum.HumanoidVisualLayers.RLeg" ]
      - map: [ "enum.HumanoidVisualLayers.LLeg" ]
      # Erida start
      - map: [ "enum.HumanoidVisualLayers.UndergarmentBottom" ] # erida edit
      - map: [ "enum.HumanoidVisualLayers.UndergarmentTop" ] # erida edit
      - map: [ "underpants" ]
      - map: [ "undershirt" ]
      - map: [ "enum.HumanoidVisualLayers.LFoot" ]
      - map: [ "enum.HumanoidVisualLayers.RFoot" ]
      - map: [ "socks" ]
      - map: [ "jumpsuit" ]
      # Erida end
      - map: [ "enum.HumanoidVisualLayers.LHand" ]
      - map: [ "enum.HumanoidVisualLayers.RHand" ]
      - map: [ "enum.HumanoidVisualLayers.Handcuffs" ]
        color: "#ffffff"
        sprite: _Erida/Objects/Misc/handcuffs.rsi
        state: body-overlay-2
        visible: false
      - map: [ "id" ]
      - map: [ "gloves" ]
      - map: [ "shoes" ]
      - map: [ "ears" ]
      - map: [ "outerClothing" ]
      - map: [ "eyes" ]
      - map: [ "belt" ]
      - map: [ "neck" ]
      - map: [ "back" ]
      - map: [ "enum.HumanoidVisualLayers.Face" ]
      - map: [ "enum.HumanoidVisualLayers.FacialHair" ]
      - map: [ "enum.HumanoidVisualLayers.HeadSide" ]
      - map: [ "maskalt" ]
      - map: [ "enum.HumanoidVisualLayers.Hair" ]
      - map: [ "mask" ]
      - map: [ "enum.HumanoidVisualLayers.HeadTop" ]
      - map: [ "enum.HumanoidVisualLayers.Tail" ]
      - map: [ "head" ]
      - map: [ "pocket1" ]
      - map: [ "pocket2" ]
  - type: MeleeWeapon
    hidden: true
    soundHit:
      path: /Audio/Weapons/pierce.ogg
    angle: 30
    animation: WeaponArcPunch
    damage:
      types:
        Piercing: 5
  - type: Perishable
  - type: Damageable
  - type: Temperature
  - type: TemperatureDamage
  - type: ScentTracker # Einstein Engines
  - type: Vocal
    sounds:
      Male: MaleHuman
      Female: FemaleHuman
      Unsexed: FemaleHuman
  - type: Tag
    tags:
    - CanPilot
    - FootstepSound
    - DoorBumpOpener
    - AnomalyHost

