# erida edit - port InteQ
- type: entity
  parent: MarkerBase
  id: SpawnMobCarpBrownInteQ
  name: InteQ carp spawner
  categories:
  - Spawner
  components:
  - type: Sprite
    layers:
    - state: green
    - sprite: _Orion/Mobs/Pets/inteq_carp.rsi
      state: icon
  - type: ConditionalSpawner
    prototypes:
    - MobCarpBrownInteQ
- type: entity
  parent: MarkerBase
  id: SpawnMobInteQAgentRandom
  name: InteQ agent spawner
  suffix: 20%
  categories:
  - Spawner
  components:
  - type: Sprite
    layers:
    - state: green
    - sprite: _Orion/Mobs/Npc/gigachad_inteq.rsi
      state: alive
  - type: RandomSpawner
    prototypes:
    - MobInteQAgent
    chance: 0.2
- type: entity
  parent: BaseStructure
  abstract: true
  id: SpawnPointInteQ
  name: InteQ sleeper
  suffix: Spawner, Ghost Role, Player Appearance
  categories:
  - Spawner
  components:
  - type: GhostTakeoverAvailable
  - type: GhostRole
    raffle:
      settings: default
    mindRoles:
    - MindRoleGhostRoleInteQAntagonist
  - type: CloningAppearance
    copyTraits: true
    components:
    - type: AntagImmune
    - type: NpcFactionMember
      factions:
      - InteQ
    - type: LanguageKnowledge
      speaks:
      - TauCetiBasic
      - OldFastCodes
      understands:
      - TauCetiBasic
      - OldFastCodes
  - type: RandomHumanoidAppearance
    randomizeName: false
  - type: RandomMetadata
    nameFormat: name-format-standard
  - type: Sprite
    layers:
    - sprite: _Orion/Structures/cryostasis_sleeper.rsi
      state: sleeper_1
      map:
      - base
- type: entity
  parent: SpawnPointInteQ
  id: SpawnPointInteQVanguardLeaderSizo37
  name: InteQ Vanguard Leader sleeper
  suffix: Spawner, Sizo-73 Ghost Role, Player Appearance
  categories:
  - Spawner
  components:
  - type: GhostTakeoverAvailable
  - type: GhostRole
    name: ghost-role-information-inteq-vanguard-leader
    description: ghost-role-information-inteq-vanguard-leader-SIZO-description
    rules: ghost-role-information-inteq-SIZO-rules
    job: InteQVanguardLeader
  - type: CloningAppearance
    startingGear: InteQVanguardLeaderSizoGear
    components:
    - type: RandomMetadata
      nameSegments:
      - InteQVanguardLeaderNamesPrefix
      - NamesMilitaryLast
      nameFormat: name-format-standard
    - type: AutoImplant
      implants:
      - DeathRattleImplantInteQ
    - type: RadioAnnounceOnSpawn
      message: radio-announce-inteq-vanguard-leader-sizo-spawn
      announcementChannels:
      - InteQ
