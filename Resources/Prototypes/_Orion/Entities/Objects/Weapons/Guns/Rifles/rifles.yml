# erida edit - port InteQ
# 5.45
- type: entity
  parent: [BaseWeaponRifle , BaseMajorContraband]
  id: WeaponRifleInteQAKM
  name: InteQ AKM
  description: Iconic weapon of war. Uses 5.45mm rifle ammo. It is painted in the InteQ brand color.
  suffix: Rifle
  components:
  - type: Sprite
    sprite: _Orion/Objects/Weapons/Guns/Rifles/inteq_akm.rsi
    scale: 0.9, 0.9
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-0
        map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: _Orion/Objects/Weapons/Guns/Rifles/inteq_akm.rsi
  - type: Item
    sprite: _Orion/Objects/Weapons/Guns/Rifles/inteq_akm.rsi
  - type: Gun
    soundGunshot:
      path: /Audio/_Orion/Weapons/Guns/Rifles/ak47.ogg
  - type: ChamberMagazineAmmoProvider
    soundRack:
      path: /Audio/Weapons/Guns/Cock/ltrifle_cock.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        startingItem: MagazineLightRifle
        insertSound: /Audio/Weapons/Guns/MagIn/ltrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/ltrifle_magout.ogg
        priority: 2
        whitelist:
          tags:
            - MagazineLightRifle
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        startingItem: CartridgeLightRifle
        priority: 1
        whitelist:
          tags:
            - CartridgeLightRifle
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
