# erida edit - port InteQ
- type: entity
  parent: BaseItem
  id: ExperiScanner
  name: experi-scanner
  description: A handheld scanner for performing non-destructive research experiments.
  components:
  - type: Sprite
    sprite: _Orion/Objects/Specific/Research/experi_scanner.rsi
    state: icon
  - type: Item
    size: Small
    storedRotation: -90
  - type: Clothing
    sprite: _Orion/Objects/Specific/Research/experi_scanner.rsi
    quickEquip: false
    slots:
    - Belt
  - type: ActivatableUI
    key: enum.AnomalyScannerUiKey.Key
    requireActiveHand: false
    inHandsOnly: true
  - type: UserInterface
    interfaces:
      enum.AnomalyScannerUiKey.Key:
        type: AnomalyScannerBoundUserInterface
  - type: Appearance
  - type: AnomalyScanner
  - type: ResearchClient
  - type: PhysicalComposition
    materialComposition:
      Steel: 100
      Glass: 50
      Plastic: 25
