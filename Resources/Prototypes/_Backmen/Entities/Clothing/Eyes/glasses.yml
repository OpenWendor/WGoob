- type: entity
  parent: [ClothingEyesBase, ShowSecurityIcons, BaseBlueShieldContraband]
  id: ClothingEyesGlassesBlueShield
  name: ent-ClothingEyesGlassesBlueShield
  description: ent-ClothingEyesGlassesBlueShield.desc
  components:
  - type: Sprite
    sprite: _Erida/Clothing/Eyes/Glasses/blueglasses.rsi
  - type: Clothing
    sprite: _Erida/Clothing/Eyes/Glasses/blueglasses.rsi
  - type: FlashImmunity
  - type: EyeProtection
    protectionTime: 5
  - type: Tag
    tags:
    - Sunglasses
    - HamsterWearable

- type: entity
  parent: ClothingEyesGlassesBlueShield
  id: ClothingEyesBlueshieldVisor
  name: ent-ClothingEyesBlueshieldVisor
  description: ent-ClothingEyesBlueshieldVisor.desc
  components:
  - type: Sprite
    sprite: _Erida/Clothing/Eyes/Glasses/bluevisor.rsi
    layers:
    - state: icon
    - state: icon-unshaded
      shader: unshaded
  - type: Clothing
    sprite: _Erida/Clothing/Eyes/Glasses/bluevisor.rsi
    clothingVisuals:
      eyes:
      - state: equipped-EYES
      - state: equipped-EYES-unshaded
        shader: unshaded
  - type: EyeProtection
  - type: IdentityBlocker
    coverage: EYES