- type: entity
  id: CombatKnifeSpetsnaz
  parent: CombatKnife
  name: Tactical Knife
  description: A knife designed for special operations operatives. Sharp!
  components:
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Items/crowbar_drop.ogg
  - type: Tag
    tags:
    - Knife
  - type: Sharp
  - type: Sprite
    sprite: Objects/Weapons/Melee/combat_knife.rsi
    state: icon
  - type: Clothing
    quickEquip: false
    slots:
    - neck
  - type: Item
    sprite: Objects/Weapons/Melee/combat_knife.rsi
    size: Small
  - type: MeleeWeapon
    damage:
      types:
        Slash: 15 # Erida-edit 20 -> 15
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: Prying
